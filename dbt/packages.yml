# Paket dbt yang dipakai.
#
# Catatan: `dbt_expectations` sengaja TIDAK dipasang — test yang kita
# butuhkan sudah tercakup oleh dbt_utils (expression_is_true,
# unique_combination_of_columns) plus generic test bawaan dbt
# (unique, not_null, accepted_values, relationships).
# Bila nanti diperlukan, pakai `metaplane/dbt_expectations`
# (repositori calogica sudah dipindahkan).

packages:
  - package: dbt-labs/dbt_utils
    version: [">=1.1.1", "<2.0.0"]
